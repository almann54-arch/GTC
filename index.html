<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroHeadset X1 — Где купить</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #161922;
      --primary: #6c5ce7;
      --primary-hover: #5a4bd4;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #2d3748;
      --success: #2ecc71;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; flex: 1; }
    .hero { text-align: center; margin-bottom: 3rem; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 1.5rem; }
    .btn-primary {
      background: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem;
      font-size: 1rem; border-radius: var(--radius); cursor: pointer; transition: 0.2s;
      box-shadow: var(--shadow);
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
    
    .fallback-section { background: var(--surface); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border); }
    .fallback-section h2 { margin-bottom: 1rem; font-size: 1.5rem; }
    .fallback-form { display: grid; gap: 0.8rem; }
    .fallback-form input, .fallback-form textarea {
      background: #1e222d; border: 1px solid var(--border); color: var(--text);
      padding: 0.8rem; border-radius: 8px; font-size: 1rem; width: 100%;
    }
    .fallback-form textarea { min-height: 80px; resize: vertical; }
    .btn-secondary {
      background: transparent; border: 1px solid var(--primary); color: var(--primary);
      padding: 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.2s;
    }
    .btn-secondary:hover { background: rgba(108, 92, 231, 0.1); }
    .status-msg { margin-top: 0.5rem; font-size: 0.9rem; min-height: 1.2em; }
    .status-msg.success { color: var(--success); }
    .status-msg.error { color: #ef4444; }

    /* Chat Widget */
    .chat-toggle {
      position: fixed; bottom: 2rem; right: 2rem; width: 56px; height: 56px;
      background: var(--primary); color: white; border: none; border-radius: 50%;
      font-size: 1.5rem; cursor: pointer; box-shadow: var(--shadow); z-index: 100;
    }
    .chat-widget {
      position: fixed; bottom: 6rem; right: 2rem; width: 350px; max-height: 500px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; z-index: 99;
    }
    .chat-widget.hidden { display: none; }
    .chat-header {
      padding: 0.8rem 1rem; background: #1f2430; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; font-weight: 500;
    }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; }
    .message { padding: 0.6rem 0.9rem; border-radius: 10px; max-width: 85%; word-wrap: break-word; font-size: 0.95rem; }
    .message.user { align-self: flex-end; background: var(--primary); color: white; }
    .message.ai { align-self: flex-start; background: #2a2f3c; }
    .typing { font-style: italic; color: var(--text-muted); font-size: 0.9rem; }
    .chat-input-area { display: flex; padding: 0.8rem; border-top: 1px solid var(--border); gap: 0.5rem; }
    .chat-input-area input {
      flex: 1; background: #1e222d; border: 1px solid var(--border); color: var(--text);
      padding: 0.6rem 0.8rem; border-radius: 8px; outline: none;
    }
    .send-btn { background: var(--primary); color: white; border: none; padding: 0.6rem 0.8rem; border-radius: 8px; cursor: pointer; }
    
    @media (max-width: 600px) {
      .hero h1 { font-size: 2rem; }
      .chat-widget { width: calc(100vw - 2rem); right: 1rem; bottom: 5.5rem; }
      .chat-toggle { right: 1rem; bottom: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>NeuroHeadset X1</h1>
      <p>Умные наушники с нейроинтерфейсом. Узнайте актуальные точки продаж, цены и наличие в вашем регионе.</p>
      <button id="openChat" class="btn-primary">🤖 Спросить AI-помощника</button>
    </header>

    <section class="fallback-section">
      <h2>Не нашли свой регион или нужна помощь менеджера?</h2>
      <form id="fallbackForm" class="fallback-form">
        <input type="text" name="name" placeholder="Ваше имя" required>
        <input type="text" name="contact" placeholder="Email или Telegram" required>
        <input type="text" name="region" placeholder="Город / Страна" required>
        <textarea name="message" placeholder="Дополнительная информация (необязательно)"></textarea>
        <button type="submit" class="btn-secondary">Отправить запрос</button>
        <p id="formStatus" class="status-msg"></p>
      </form>
    </section>
  </main>

  <!-- AI Chat Widget -->
  <button id="chatToggle" class="chat-toggle">💬</button>
  <div id="chatWidget" class="chat-widget hidden">
    <div class="chat-header">
      <span>AI-Помощник</span>
      <button id="closeChat" class="close-btn">&times;</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Напишите ваш вопрос..." autocomplete="off">
      <button id="sendMessage" class="send-btn">➤</button>
    </div>
  </div>

  <script>
    // 🔧 НАСТРОЙКИ: замените на ваши URL-ы вебхуков n8n
    const CHAT_WEBHOOK ='https://antfc-5-136-77-205.run.pinggy-free.link/webhook-test/chat';/webhook-test/chat';
    const FALLBACK_WEBHOOK ='https://antfc-5-136-77-205.run.pinggy-free.link/webhook-test/chat';/webhook-test/chat';

    // Chat State
    const sessionId = crypto.randomUUID();
    const chatWidget = document.getElementById('chatWidget');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendMessage');
    const openBtn = document.getElementById('openChat');
    const toggleBtn = document.getElementById('chatToggle');
    const closeBtn = document.getElementById('closeChat');

    // UI Helpers
    const toggleChat = () => chatWidget.classList.toggle('hidden');
    openBtn.addEventListener('click', toggleChat);
    toggleBtn.addEventListener('click', toggleChat);
    closeBtn.addEventListener('click', toggleChat);

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message ai typing';
      div.id = 'typingIndicator';
      div.textContent = 'Думаю...';
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // Send Chat
    async function sendChat() {
      const text = chatInput.value.trim();
      if (!text) return;
      
      addMessage(text, 'user');
      chatInput.value = '';
      showTyping();

      try {
        const res = await fetch(CHAT_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatInput: text, sessionId })
      });
      
      // Читаем ответ от n8n как обычный текст
      const aiResponseText = await res.text();
      hideTyping();

      if (aiResponseText.trim()) {
        addMessage(aiResponseText, 'ai');
      } else {
        addMessage("Сервер прислал пустой ответ.", 'ai');
      }

    } catch (error) {
      hideTyping();
      addMessage("Ошибка связи с сервером.", 'ai');
      console.error(error);
    }
  }

  // Привязываем функцию к кнопкам
  sendBtn.addEventListener('click', sendChat);
  chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendChat();
  });
</script>

<script src="chat-widget.js"></script>
</body>
</html>
